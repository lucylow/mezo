kind = "web"
previewPath = "/"
title = "veMEZO Auto-Compounder"
version = "1.0.0"
id = "artifacts/vemezo-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19395

[services.development]
run = "pnpm --filter @workspace/vemezo-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vemezo-landing", "run", "build" ]
publicDir = "artifacts/vemezo-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19395"
BASE_PATH = "/"
