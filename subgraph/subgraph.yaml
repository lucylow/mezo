specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  # ── Vault ─────────────────────────────────────────────────────────────────
  - kind: ethereum
    name: VeMEZOAutoCompounder
    network: mezo-testnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: VeMEZOAutoCompounder
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
        - User
        - Deposit
        - Withdrawal
        - Compound
        - FeeDistribution
        - FeeCollected
        - TreasuryStaked
        - UserRewardClaim
        - DailyMetric
        - EpochVote
      abis:
        - name: VeMEZOAutoCompounder
          file: ./abis/VeMEZOAutoCompounder.json
      eventHandlers:
        - event: Deposited(indexed address,indexed uint256,uint256,uint256)
          handler: handleDeposited
        - event: Withdrawn(indexed address,indexed uint256,uint256,uint256)
          handler: handleWithdrawn
        - event: Compounded(uint256,uint256,uint256)
          handler: handleCompounded
        - event: FeeDistributed(uint256,uint256,uint256)
          handler: handleFeeDistributed
        - event: RewardsClaimed(indexed address,uint256)
          handler: handleRewardsClaimed
        - event: FeeCollected(uint256,uint256,address)
          handler: handleFeeCollected
        - event: TreasuryStaked(uint256,uint256)
          handler: handleTreasuryStaked
        - event: GaugesVoted(indexed uint256,uint256,uint256)
          handler: handleGaugesVoted
      file: ./src/mapping.ts

  # ── Governor ──────────────────────────────────────────────────────────────
  - kind: ethereum
    name: VaultGovernor
    network: mezo-testnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: VaultGovernor
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - GovernanceProposal
        - GovernanceVote
      abis:
        - name: VaultGovernor
          file: ./abis/VaultGovernor.json
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
        - event: ProposalCanceled(uint256)
          handler: handleProposalCanceled
        - event: ProposalQueued(uint256,uint256)
          handler: handleProposalQueued
      file: ./src/mapping.ts

  # ── Timelock ──────────────────────────────────────────────────────────────
  - kind: ethereum
    name: VaultTimelockController
    network: mezo-testnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: VaultTimelockController
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TimelockOperation
      abis:
        - name: VaultTimelockController
          file: ./abis/VaultTimelockController.json
      eventHandlers:
        - event: CallScheduled(indexed bytes32,indexed uint256,address,uint256,bytes,bytes32,uint256)
          handler: handleCallScheduled
        - event: CallExecuted(indexed bytes32,indexed uint256,address,uint256,bytes)
          handler: handleCallExecuted
        - event: Cancelled(indexed bytes32)
          handler: handleCancelled
      file: ./src/mapping.ts
