type Vault @entity {
  id: ID!
  totalUnderlying: BigInt!
  totalShares: BigInt!
  performanceFee: Int!
  feeDistributionRate: Int!
  lastCompoundTime: BigInt!
  totalDeposits: Int!
  totalCompounded: BigInt!
  totalFeesCollected: BigInt!
  createdAt: BigInt!
  updatedAt: BigInt!
}

type User @entity {
  id: ID!
  address: Bytes!
  shareBalance: BigInt!
  underlyingValue: BigInt!
  deposits: [Deposit!]! @derivedFrom(field: "user")
  withdrawals: [Withdrawal!]! @derivedFrom(field: "user")
  rewardClaims: [UserRewardClaim!]! @derivedFrom(field: "user")
  tokenIds: [String!]!
  totalRewardsClaimed: BigInt!
  createdAt: BigInt!
  updatedAt: BigInt!
}

type Deposit @entity {
  id: ID!
  user: User!
  tokenId: BigInt!
  value: BigInt!
  shares: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type Withdrawal @entity {
  id: ID!
  user: User!
  tokenId: BigInt!
  value: BigInt!
  shares: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type Compound @entity {
  id: ID!
  totalRewards: BigInt!
  fee: BigInt!
  amountCompounded: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type FeeDistribution @entity {
  id: ID!
  totalFee: BigInt!
  toHolders: BigInt!
  toTreasury: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

# ── MUSD Fee Collection ────────────────────────────────────────────────────────

type FeeCollected @entity {
  id: ID!
  mezoAmount: BigInt!
  musdAmount: BigInt!
  treasury: Bytes!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type TreasuryStaked @entity {
  id: ID!
  musdAmount: BigInt!
  sMUSDShares: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type UserRewardClaim @entity {
  id: ID!
  user: User!
  amount: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type DailyMetric @entity {
  id: ID!
  date: Int!
  tvl: BigInt!
  totalShares: BigInt!
  totalUsers: Int!
  dailyRewards: BigInt!
  dailyFees: BigInt!
  dailyFeesToHolders: BigInt!
  dailyFeesToTreasury: BigInt!
}

# ── Governance ────────────────────────────────────────────────────────────────

enum ProposalStatus {
  PENDING
  ACTIVE
  CANCELED
  DEFEATED
  SUCCEEDED
  QUEUED
  EXECUTED
  EXPIRED
}

type GovernanceProposal @entity {
  id: ID!
  proposalId: BigInt!
  proposer: Bytes!
  description: String!
  targets: [Bytes!]!
  calldatas: [Bytes!]!
  startBlock: BigInt!
  endBlock: BigInt!
  status: ProposalStatus!
  forVotes: BigInt!
  againstVotes: BigInt!
  abstainVotes: BigInt!
  executed: Boolean!
  createdAt: BigInt!
  updatedAt: BigInt!
  votes: [GovernanceVote!]! @derivedFrom(field: "proposal")
}

type GovernanceVote @entity {
  id: ID!
  proposal: GovernanceProposal!
  voter: Bytes!
  support: Int!
  weight: BigInt!
  reason: String
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type TimelockOperation @entity {
  id: ID!
  operationId: Bytes!
  target: Bytes!
  value: BigInt!
  data: Bytes!
  predecessor: Bytes!
  delay: BigInt!
  status: String!
  scheduledAt: BigInt!
  executedAt: BigInt
}

type EpochVote @entity {
  id: ID!
  epochTimestamp: BigInt!
  tokenCount: BigInt!
  gaugeCount: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}
